<svg xmlns="http://www.w3.org/2000/svg" width="328" height="150" viewBox="0 0 328 150" role="img" aria-label="Karte: Design rein, Website raus. Ich bau, wenn das Design steht.">
  <defs>
    <style>
      @font-face { font-family: 'Geo'; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'Vend Sans'; font-weight: 300; src: url(data:font/woff2;base64,) format('woff2'); }
    </style>
    <clipPath id="rund"><rect width="328" height="150" rx="12" ry="12"/></clipPath>
    <radialGradient id="glowGruen" gradientUnits="userSpaceOnUse" cx="328" cy="0" r="230">
      <stop offset="0" stop-color="#0f8561" stop-opacity=".45"/><stop offset=".5" stop-color="#0f8561" stop-opacity=".14"/><stop offset="1" stop-color="#0f8561" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPetrol" gradientUnits="userSpaceOnUse" cx="248" cy="20" r="260">
      <stop offset="0" stop-color="#306068" stop-opacity=".45"/><stop offset=".55" stop-color="#306068" stop-opacity=".14"/><stop offset="1" stop-color="#306068" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#rund)">
    <rect width="328" height="150" fill="#181818"/>
    <rect width="328" height="150" fill="url(#glowPetrol)"/>
    <rect width="328" height="150" fill="url(#glowGruen)"/>
    <g transform="translate(24 24) scale(1.3333333333333333)" fill="none" stroke="#5fc9a5" stroke-width="1.125" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="7" x="3" y="3" rx="1"/><rect width="9" height="7" x="3" y="14" rx="1"/><rect width="5" height="7" x="16" y="14" rx="1"/></g>
    <text x="24" y="102" font-family="'Geo', sans-serif" font-size="21" fill="#ffffff">Design rein, Website raus</text>
    <text x="24" y="128" font-family="'Vend Sans', sans-serif" font-weight="300" font-size="15" fill="#ffffff">Ich bau, wenn das Design steht.</text>
  </g>
</svg>
